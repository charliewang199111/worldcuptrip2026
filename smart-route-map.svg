<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">World Cup 2026 smart route planning map</title>
  <desc id="desc">A stylized route map connecting host cities with match, hotel, flight and fan demand panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf6"/>
      <stop offset="0.55" stop-color="#eef6f2"/>
      <stop offset="1" stop-color="#fff7e2"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6f4a"/>
      <stop offset="0.48" stop-color="#c18b23"/>
      <stop offset="1" stop-color="#b73535"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#17211c" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="920" height="620" rx="36" fill="url(#bg)"/>
  <path d="M126 476 C210 386 250 270 356 288 C458 306 500 168 626 196 C738 220 762 334 820 244" fill="none" stroke="#d8ded8" stroke-width="86" stroke-linecap="round" opacity=".58"/>
  <path d="M126 476 C210 386 250 270 356 288 C458 306 500 168 626 196 C738 220 762 334 820 244" fill="none" stroke="url(#route)" stroke-width="12" stroke-linecap="round" stroke-dasharray="20 18"/>
  <g fill="#fff" stroke="#d8ded8" stroke-width="2" filter="url(#shadow)">
    <rect x="46" y="42" width="302" height="126" rx="20"/>
    <rect x="578" y="430" width="286" height="128" rx="20"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="72" y="82" fill="#b73535" font-size="15" font-weight="800">SMART MATCH ROUTE</text>
    <text x="72" y="118" fill="#17211c" font-size="28" font-weight="900">LA -> Dallas -> NY/NJ</text>
    <text x="72" y="146" fill="#5a6760" font-size="18">Ticket + hotel + flight pressure</text>
    <text x="606" y="472" fill="#b73535" font-size="15" font-weight="800">HOTEL HEAT</text>
    <text x="606" y="508" fill="#17211c" font-size="28" font-weight="900">Very high near final</text>
    <text x="606" y="536" fill="#5a6760" font-size="18">Book flexible rooms early</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="900">
    <g transform="translate(112 442)">
      <circle r="34" fill="#1f6f4a"/>
      <text x="-18" y="8" fill="#fff" font-size="22">LA</text>
      <text x="-46" y="62" fill="#17211c" font-size="15">Jun 12</text>
    </g>
    <g transform="translate(356 288)">
      <circle r="34" fill="#c18b23"/>
      <text x="-25" y="8" fill="#fff" font-size="21">DAL</text>
      <text x="-48" y="62" fill="#17211c" font-size="15">Flights $$</text>
    </g>
    <g transform="translate(625 196)">
      <circle r="34" fill="#b73535"/>
      <text x="-24" y="8" fill="#fff" font-size="21">NY</text>
      <text x="-30" y="62" fill="#17211c" font-size="15">Final</text>
    </g>
    <g transform="translate(746 316)">
      <circle r="28" fill="#11442e"/>
      <text x="-24" y="7" fill="#fff" font-size="18">MIA</text>
      <text x="-46" y="54" fill="#17211c" font-size="14">Hotels hot</text>
    </g>
    <g transform="translate(236 238)">
      <circle r="28" fill="#2d7f68"/>
      <text x="-25" y="7" fill="#fff" font-size="18">MEX</text>
      <text x="-38" y="54" fill="#17211c" font-size="14">Opening</text>
    </g>
  </g>
  <g fill="#fff" stroke="#d8ded8" stroke-width="2">
    <rect x="62" y="214" width="170" height="66" rx="16"/>
    <rect x="690" y="92" width="170" height="66" rx="16"/>
    <rect x="386" y="466" width="166" height="66" rx="16"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="800" fill="#17211c">
    <text x="84" y="242" font-size="15">Fan tips</text>
    <text x="84" y="264" font-size="18">Ride share</text>
    <text x="712" y="120" font-size="15">Match timing</text>
    <text x="712" y="142" font-size="18">8 nights</text>
    <text x="408" y="494" font-size="15">Route score</text>
    <text x="408" y="516" font-size="18">Balanced</text>
  </g>
</svg>
